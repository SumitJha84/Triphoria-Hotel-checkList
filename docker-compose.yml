services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  

  temporal-ui:
    image: temporalio/ui:2.34.0
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

  api:
    build:
      context: .
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 300
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offers
      SUPPLIER_A_URL: http://api:3000
      SUPPLIER_B_URL: http://api:3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
    command: ["node", "dist/temporal/worker.js"]
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 300
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offers
      SUPPLIER_A_URL: http://api:3000
      SUPPLIER_B_URL: http://api:3000

volumes:
  redis-data:
  temporal-postgres-data:
